name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vocoder:
    name: Vocoder (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Melo.Vocoder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: Melo.Vocoder/uv.lock
      - name: Install editable package and test dependencies
        run: uv sync --locked --dev --extra export
      - name: Check editable installation
        run: |
          uv run --no-sync python -c "from melo.vocoder import NHNVocoder, VocoderSession"
          uv run --no-sync nhn-vocoder --help
      - name: Build wheel
        run: uv build --wheel
      - name: Replace editable installation with wheel
        run: uv run --no-sync python -c "import pathlib, subprocess; wheel, = pathlib.Path('dist').glob('*.whl'); subprocess.run(['uv', 'pip', 'install', '--python', '.venv', '--no-deps', '--reinstall', str(wheel)], check=True)"
      - name: Test wheel installation, export, and CLI entry points
        run: uv run --no-sync pytest -q

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Melo.Core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install "cmake>=3.28" ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug
