[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melostudio-nhn-vocoder"
version = "0.1.0"
description = "Compact NHN-inspired vocoder for 72-D LLSM features"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "soundfile>=0.12",
  "tensorboard>=2.18",
  "torch>=2.4",
]

[project.optional-dependencies]
analysis = [
  "praat-parselmouth>=0.4.6",
  "pyllsm2==0.2.0",
  "torchfcpe>=0.0.4",
]
rmvpe = [
  "rmvpe-onnx>=0.2.3",
]
export = [
  "onnx>=1.17",
  "onnxruntime>=1.20",
]

[project.scripts]
nhn-vocoder = "vocoder.entrypoints.__main__:main"
nhn-analyze = "vocoder.preprocessing.analyze:main"
nhn-benchmark = "vocoder.inference.benchmark:main"
nhn-compare-f0 = "vocoder.preprocessing.compare_f0:main"
nhn-export = "vocoder.inference.export:main"
nhn-infer = "vocoder.inference.infer:main"
nhn-preprocess = "vocoder.preprocessing.preprocess:main"
nhn-preprocess-bwe = "vocoder.preprocessing.preprocess_bwe:main"
nhn-stats = "vocoder.preprocessing.stats:main"
nhn-synthesize = "vocoder.inference.synthesize:main"
nhn-train = "vocoder.training.train:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.setuptools]
packages = [
  "vocoder",
  "vocoder.core",
  "vocoder.entrypoints",
  "vocoder.inference",
  "vocoder.preprocessing",
  "vocoder.sdk",
  "vocoder.training",
]

[tool.setuptools.package-dir]
vocoder = "."
"vocoder.core" = "core"
"vocoder.entrypoints" = "entrypoints"
"vocoder.inference" = "inference"
"vocoder.preprocessing" = "preprocessing"
"vocoder.sdk" = "sdk"
"vocoder.training" = "training"

[tool.pytest.ini_options]
testpaths = ["tests"]
