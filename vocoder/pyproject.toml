[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melostudio-nhn-vocoder"
version = "0.1.0"
description = "Compact NHN-inspired vocoder for 72-D LLSM features"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "soundfile>=0.12",
  "tensorboard>=2.18",
  "torch>=2.4",
]

[project.optional-dependencies]
analysis = [
  "praat-parselmouth>=0.4.6",
  "pyllsm2==0.2.0",
  "torchfcpe>=0.0.4",
]
rmvpe = [
  "rmvpe-onnx>=0.2.3",
]
export = [
  "onnx>=1.17",
  "onnxruntime>=1.20",
]

[project.scripts]
nhn-analyze = "vocoder.analyze:main"
nhn-benchmark = "vocoder.benchmark:main"
nhn-compare-f0 = "vocoder.compare_f0:main"
nhn-export = "vocoder.export:main"
nhn-infer = "vocoder.infer:main"
nhn-preprocess = "vocoder.preprocess:main"
nhn-preprocess-bwe = "vocoder.preprocess_bwe:main"
nhn-stats = "vocoder.stats:main"
nhn-synthesize = "vocoder.synthesize:main"
nhn-train = "vocoder.train:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.setuptools]
packages = ["vocoder", "vocoder.sdk"]

[tool.setuptools.package-dir]
vocoder = "."
"vocoder.sdk" = "sdk"

[tool.pytest.ini_options]
testpaths = ["tests"]
