[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melostudio-nhn-vocoder"
version = "0.1.0"
description = "Compact NHN-inspired vocoder for 72-D LLSM features"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "soundfile>=0.12",
  "tensorboard>=2.18",
  "torch>=2.4",
]

[project.optional-dependencies]
analysis = [
  "praat-parselmouth>=0.4.6",
  "pyllsm2==0.2.0",
  "torchfcpe>=0.0.4",
]
rmvpe = [
  "rmvpe-onnx>=0.2.3",
]
export = [
  "onnx>=1.17",
  "onnxruntime>=1.20",
]

[project.scripts]
nhn-vocoder = "melo.vocoder.entrypoints.__main__:main"
nhn-analyze = "melo.vocoder.preprocessing.analyze:main"
nhn-benchmark = "melo.vocoder.inference.benchmark:main"
nhn-compare-f0 = "melo.vocoder.preprocessing.compare_f0:main"
nhn-export = "melo.vocoder.inference.export:main"
nhn-infer = "melo.vocoder.inference.infer:main"
nhn-preprocess = "melo.vocoder.preprocessing.preprocess:main"
nhn-preprocess-bwe = "melo.vocoder.preprocessing.preprocess_bwe:main"
nhn-stats = "melo.vocoder.preprocessing.stats:main"
nhn-synthesize = "melo.vocoder.inference.synthesize:main"
nhn-train = "melo.vocoder.training.train:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.setuptools]
packages = [
  "melo.vocoder",
  "melo.vocoder.core",
  "melo.vocoder.entrypoints",
  "melo.vocoder.inference",
  "melo.vocoder.preprocessing",
  "melo.vocoder.sdk",
  "melo.vocoder.training",
]

[tool.setuptools.package-dir]
"melo.vocoder" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
